<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>APPSC Group-I Prelims Planner</title>
<meta name="description" content="87-day APPSC Group-I prelims planner with spaced repetition, mock tracking and analytics.">
<meta name="theme-color" content="#14634f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f4f6f3;--fg:#17211c;--cd:#fff;--mu:#66726b;--ac:#14634f;--bd:#dde3dd;--ok:#2e9e5b;--wa:#d9962b;--er:#d64545;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e6ece8;--cd:#1a231f;--mu:#93a39a;--ac:#4cc9a4;--bd:#2b3731;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e6ece8;--cd:#1a231f;--mu:#93a39a;--ac:#4cc9a4;--bd:#2b3731;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 "Source Sans 3",system-ui,sans-serif;max-width:640px;margin:auto;padding:0 10px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font:700 20px/1.2 "Fraunces",Georgia,serif;margin:12px 0 2px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:4px;padding:6px 0;z-index:9;overflow-x:auto}
nav button{flex:1;padding:8px 4px;border:1px solid var(--bd);background:var(--cd);color:var(--fg);border-radius:8px;font:inherit;font-weight:600;white-space:nowrap}
nav button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0}
.r{display:flex;align-items:center;gap:8px}.m{color:var(--mu);font-size:13px}
.b.on{opacity:.62}.b label{cursor:pointer}.b input[type=checkbox]{width:22px;height:22px;accent-color:var(--ac);flex:none}
.ch{font-style:normal;font-size:11px;color:#fff;padding:1px 7px;border-radius:9px;margin-right:6px;white-space:nowrap}
button,select,input{font:inherit;color:var(--fg);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:6px 9px}
button.g{width:100%;margin-top:6px}
.bar{height:9px;background:var(--bd);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.k div{text-align:center;background:var(--bg);border-radius:8px;padding:8px 2px}.k b{font:700 22px Fraunces,Georgia,serif;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cal div{aspect-ratio:1;border-radius:6px;font-size:12px;text-align:center;padding-top:3px;border:1px solid var(--bd);cursor:pointer;background:var(--cd)}
.cal .h{border:0;aspect-ratio:auto;cursor:default;background:none;color:var(--mu);font-size:11px}.cal small{display:block;font-size:9px;color:var(--mu)}
.heat{display:flex;flex-wrap:wrap;gap:3px}.heat i{width:20px;height:20px;border-radius:4px}
.due{padding:4px 0;border-top:1px dashed var(--bd);display:flex;gap:8px;align-items:center;font-size:14px}
.tip{background:var(--bg);border-left:3px solid var(--wa);padding:6px 10px;border-radius:4px;font-size:14px;margin:6px 0}
.tip.ok{border-left-color:var(--ok)}.tip.er{border-left-color:var(--er)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:4px;border-bottom:1px solid var(--bd);text-align:left}
.f{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.f input,.f select{flex:1;min-width:70px}
.g2{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:430px){.g2{grid-template-columns:1fr 1fr}}
</style></head><body>
<h1>APPSC Group-I Prelims Planner</h1><div class="m" id="hd"></div>
<nav id="nv"></nav><div id="app"></div>
<script>
const SUB={H:['History','#b4531c'],P:['Polity & IR','#2a5fc4'],E:['Economy','#2f8a4c'],G:['Geography','#0e7490'],Q:['Aptitude','#7b3fb5'],S:['Sci-Tech & Env','#b83a72'],C:['Current affairs','#8a6a12']};
const A=`H|Indus Valley, Vedic age, Mahajanapadas, Jainism, Buddhism
H|Magadha, Mauryas, foreign invasions, Kushans, Satavahanas, Sangam, Guptas
H|Kanauj, Badami and Eastern Chalukyas, Rashtrakutas, Cholas, Kakatiyas, Reddis
H|Delhi Sultanate, Vijayanagara, Mughals, Bhakti and Sufism
H|European companies, Bengal, Mysore, Andhra, Nizam, Governors-General
H|1857 revolt, reform movements, freedom movement, revolutionaries
H|Gandhi, Patel, Bose, Ambedkar, reorganisation of states
P|Constitution: evolution, Preamble, FR, FD, DPSP
P|Amendments, significant provisions, basic structure
P|Union and states, Parliament, legislatures, federalism
P|Constitutional authorities, Panchayati Raj, public policy
P|LPG impact on governance, regulatory bodies, rights issues
P|India’s foreign policy, institutions, agencies, fora
E|Indian economy basics, planning, NITI Aayog, HDI, sustainable development
E|National income, demography, poverty, unemployment, schemes
E|Agriculture: irrigation, inputs, MSP, credit, land reforms, food security
E|Industry, Make in India, SEZs, energy, trade, BoP, WTO
E|RBI, banking, NPAs, markets, SEBI, GST, Finance Commission, budget
E|Andhra Pradesh economy after 2014 bifurcation
E|AP Reorganisation Act 2014, special status, Vizag zone, Kadapa steel
G|Solar system, earth motions, interior, landforms, atmosphere
G|Climate, air masses, oceans, hazards, climate change
G|Physical geography: world, India, AP (drainage, soils, vegetation, minerals)
G|Social geography: population, literacy, tribes, migration, urbanisation
G|Economic geography: agriculture, industry, transport, trade
H|Consolidate History + Culture, 40 PYQs
P|Consolidate Polity + IR, 40 PYQs
E|Consolidate Economy + AP economy, 40 PYQs
G|Consolidate Geography, 40 PYQs
H|Paper I mini-mock (60 Qs, 60 min) + analysis`.split('\n');
const B=`Q|Number system, order of magnitude, BODMAS
Q|Powers, squares, roots, HCF and LCM
Q|Ratio, proportion, variation
Q|Percentage
Q|Profit and loss, simple and compound interest
Q|Mean, median, mode, weighted mean
Q|Time and work
Q|Time, speed, distance
Q|Algebra basics, simplification of symbols
Q|Area and perimeter of 2D shapes
Q|Volume and surface area: sphere, cone, cylinder, cuboid
Q|Lines, angles, triangles, quadrilaterals
Q|Number series, coding-decoding
Q|Relations, clocks, calendar, age
Q|Logical reasoning, analytical ability
Q|Shapes, sub-sections, Venn diagrams
Q|Data interpretation I (tables, bar, pie)
Q|Data interpretation II, data sufficiency
Q|Probability
Q|Emotional intelligence, coping with stress
Q|Social intelligence, decision making, critical thinking
Q|Timed mixed set: arithmetic (40 Qs)
Q|Timed mixed set: geometry + algebra (40 Qs)
Q|Timed mixed set: reasoning (40 Qs)
Q|Timed mixed set: DI + probability (40 Qs)
Q|Timed set: weakest two topics so far
Q|Timed mixed set: all quant (50 Qs)
Q|Timed mixed set: all reasoning (50 Qs)
Q|Revise formula sheet + shortcuts
Q|Paper II mini-mock (60 Qs, 60 min) + analysis`.split('\n');
const CT=`S|Science and technology: policy, institutions, scientists
S|ICT, e-governance, cyber security
S|Space: ISRO, IRNSS, IRS, EDUSAT
S|Defence: DRDO, defence satellites
S|Energy: needs, policy, solar, wind, nuclear
S|Environment: laws, treaties, biodiversity, forests
S|Climate change, pollution, disaster management
S|Biotech, nanotech, genetic engineering`.split('\n');
const TH=['AP and regional affairs','National: schemes, bills, policies','International: summits, treaties, IR','Reports, indices, rankings','Awards, sports, persons, places'];
const RA=`H|History: ancient, medieval, AP dynasties
H|History: modern, freedom movement, Gandhi, Ambedkar
P|Polity: Constitution, FR, DPSP, amendments
P|Polity: governance, Panchayati Raj, rights, IR
E|Economy: planning, agriculture, industry, trade
E|Finance, banking, GST + AP economy and Reorganisation Act
G|Geography: world, India, AP
S|Sci-Tech, space, defence, energy, environment`.split('\n');
const RB=['Q|Arithmetic timed set (percentage, ratio, profit, interest)','Q|Time-work-distance, mensuration, geometry timed set','Q|Reasoning timed set (series, coding, relations, Venn)','Q|DI, sufficiency, probability timed set','Q|EI, social intelligence + mixed set'];
const HT={A:'Read in 50/10 blocks, then close the book and self-test.',B:'Learn the method, then solve 15 to 20 problems against a timer.',C:'Keep short notes; link facts to Andhra Pradesh.',D:'Recall first, then grade yourself: Again, Hard, Good or Easy.',E:'Log every wrong answer in the Errors tab.',F:'Write what you remember on blank paper, then check gaps.'};
const CM=[['D','Spaced revision (due list)',40],['E','Timed MCQs (30 to 40) + error log',30],['F','Blank-page recall',10]];
const pr=s=>{const a=s.split('|');return [a[0],a[1]]};
function plan(n){
 if(n<=30){const a=pr(A[n-1]),b=pr(B[n-1]),c=n<=8?pr(CT[n-1]):n==30?['C','Monthly current-affairs compilation + 50-Q quiz']:['C','Current affairs: '+TH[(n-9)%5]+' (last 6 months)'];
  return{ph:1,bl:[['A',a[1],100,a[0],n<=25],['B',b[1],75,b[0],n<=21],['C',c[1],45,c[0],n<=8],...CM.map(x=>[...x])]}}
 const k=n-31,mk=n<=81&&k%3==2;
 if(mk){const pp=Math.floor(k/3)%2?'II':'I';return{ph:2,mock:1,bl:[['A','Full mock, Paper '+pp+' (120 Qs, 120 min, strict timing)',120,'Q'],['B','Mock analysis: tag every wrong question',90,'Q'],['C','Fix the top 3 weak topics from the analysis',60,'S'],['D','Current-affairs quiz',30,'C']]}}
 const a=pr(RA[k%8]),b=pr(RB[k%5]),fin=n>=82;
 return{ph:fin?3:2,bl:[['A',(fin?'Final pass: ':'Revision cycle '+(Math.floor(k/8)+2)+': ')+a[1],100,a[0]],['B',b[1],75,b[0]],['C','Current affairs: '+TH[k%5],45,'C'],...CM.map(x=>[...x])]}}
const TOP=[];for(let n=1;n<=30;n++)plan(n).bl.forEach(b=>{if(b[4])TOP.push({k:n+':'+b[0],n,s:b[3],t:b[1]})});
const $=s=>document.querySelector(s),N=87,EX=new Date(2027,0,24),dt=n=>new Date(2026,9,28+n);
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fd=d=>DW[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const t0=()=>{const n=new Date();return Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate())-new Date(2026,9,29))/864e5)+1};
const cd=()=>Math.min(N,Math.max(1,t0()));
let st={b:{},c:{},r:{},m:[],e:[],f:{},q:{},fm:{},h:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem('ap1g')||'{}'))}catch(e){}
st.q=st.q||{};st.fm=st.fm||{};st.h=st.h||{};
function snap(){const D=cd(),dn=TOP.filter(t=>st.b[t.k]!=null).length;let bm=0;for(const k in st.b){if(st.b[k]==D){const i=k.indexOf(':'),n=+k.slice(0,i),bl=plan(n).bl.find(x=>x[0]==k.slice(i+1));if(bl)bm+=bl[2]}}
 st.h[D]={r:rdy(),c:Math.round(dn/TOP.length*100),m:(st.fm[D]||0)+bm,d:due(D).length,e:st.e.filter(x=>x.d==D).length}}
const save=()=>{try{snap();localStorage.setItem('ap1g',JSON.stringify(st))}catch(e){}};
let tab='d',V=cd();
const ttl=k=>(TOP.find(t=>t.k==k)||{t:k}).t;
function pct(n){const p=plan(n);let a=0,d=0;p.bl.forEach(b=>{a+=b[2];if(st.b[n+':'+b[0]]!=null)d+=b[2]});return d/a}
function mins(){let s=0;for(let n=1;n<=N;n++)plan(n).bl.forEach(b=>{if(st.b[n+':'+b[0]]!=null)s+=b[2]});return s}
function due(D){const o=[];for(const t of TOP){const c=st.b[t.k];if(c==null)continue;const q=st.q[t.k]||(st.q[t.k]={e:2.5,i:1,due:c+1,n:0});if(q.due<=D)o.push({id:t.k,dd:q.due,k:t.k,x:q.i})}return o.sort((a,b)=>a.dd-b.dd)}
function gr(k,g){const q=st.q[k];if(g==0){q.i=1;q.e=Math.max(1.3,q.e-.2)}else if(g==1){q.i=Math.max(1,Math.round(q.i*1.2));q.e=Math.max(1.3,q.e-.15)}else if(g==2)q.i=Math.max(q.i+1,Math.round(q.i*q.e));else{q.i=Math.max(q.i+2,Math.round(q.i*q.e*1.3));q.e+=.15}q.n++;q.due=Math.min(cd()+q.i,Math.max(cd()+1,N-2));save();R()}
function streak(){let n=cd(),s=0;if(pct(n)<.6)n--;while(n>=1&&pct(n)>=.6){s++;n--}return s}
function tg(k){if(st.b[k]!=null){delete st.b[k];delete st.q[k]}else st.b[k]=cd();save();R()}
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');let iv;
function tick(){clearInterval(iv);iv=setInterval(()=>{const t=st.tm;if(!t){clearInterval(iv);return}const L=Math.round((t.end-Date.now())/1e3);if(L<=0){clearInterval(iv);if(t.study)st.fm[cd()]=(st.fm[cd()]||0)+t.m;st.tm=null;save();try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}R()}else{const e=$('#tc');if(e)e.textContent=mmss(L)}},1000)}
function ts(m){st.tm={end:Date.now()+m*6e4,m,study:m!=10};save();R();tick()}
function tx(){const t=st.tm;if(t&&t.study){const el=Math.floor((Date.now()-(t.end-t.m*6e4))/6e4);if(el>0)st.fm[cd()]=(st.fm[cd()]||0)+Math.min(el,t.m)}st.tm=null;save();R()}
function tm(){const t=st.tm,L=t?Math.max(0,Math.round((t.end-Date.now())/1e3)):0;return `<div class=c><div class=r><b style="flex:1">Focus timer</b><span class=m>Focused today: ${st.fm[cd()]||0} min</span></div>`+(t&&L>0?`<div class=r><b id=tc style="font-size:28px;flex:1">${mmss(L)}</b><span class=m>${t.study?'studying':'break'}</span><button onclick="tx()">Stop</button></div>`:`<div class=f><button onclick="ts(50)">Study 50</button><button onclick="ts(25)">Study 25</button><button onclick="ts(10)">Break 10</button></div>`)+'</div>'}
function cu(){const L=TOP.filter(t=>t.n<cd()&&st.b[t.k]==null);return L.length?`<div class=c><b>Catch-up queue (${L.length})</b><div class=m>Missed topics. Clear one or two a day inside your A slot.</div>`+L.slice(0,4).map(t=>`<div class=due><input type=checkbox onchange="tg('${t.k}')"><span>${esc(t.t)}</span></div>`).join('')+'</div>':''}
function rdy(){const dn=TOP.filter(t=>st.b[t.k]!=null).length,cs=Object.values(st.c).filter(Boolean),ac=cs.length?cs.reduce((a,b)=>a+b,0)/cs.length/5:0,mm=st.m.slice(-3),ms=mm.length?Math.max(0,mm.reduce((a,m)=>a+net(m),0)/mm.length)/120:0,mt=dn?Object.values(st.q).filter(q=>q.i>=7).length/dn:0;return Math.round(100*(.3*dn/TOP.length+.25*ac+.25*ms+.2*mt))}
function wk(){let h='<div class=c><b>Last 7 days</b> <span class=m>planned blocks completed</span><div class=r style="align-items:flex-end;height:74px">';for(let n=Math.max(1,cd()-6);n<=cd();n++){let s=0;plan(n).bl.forEach(b=>{if(st.b[n+':'+b[0]]!=null)s+=b[2]});h+=`<div style="flex:1;text-align:center"><div style="height:${s/300*52}px;background:var(--ac);border-radius:4px 4px 0 0"></div><div class=m style="font-size:10px">${dt(n).getDate()}</div></div>`}return h+'</div></div>'}
function bk(){return `<div class=c><b>Backup</b><div class=m>Copy this text somewhere safe. Paste it back and tap Restore to recover your progress.</div><textarea id=bt style="width:100%;height:60px;background:var(--cd);color:var(--fg);border:1px solid var(--bd);border-radius:8px">${esc(JSON.stringify(st))}</textarea><div class=f><button onclick="try{navigator.clipboard.writeText($('#bt').value)}catch(e){}">Copy</button><button onclick="rs()">Restore</button></div></div>`}
function rs(){try{const o=JSON.parse($('#bt').value);if(o&&o.b){st=Object.assign({b:{},c:{},r:{},m:[],e:[],f:{},q:{},fm:{},h:{}},o);save();R()}}catch(e){alert('That backup text could not be read.')}}
function cf(k,v){v=+v;st.c[k]=v;const q=st.q[k];if(q&&!q.n){q.i=v<=2?1:v==3?2:v==4?3:4;q.due=st.b[k]+q.i}save();R()}
function mv(d){V=Math.min(N,Math.max(1,V+d));R()}
function go(n){V=n;tab='t';R()}
/* ===== analytics helpers ===== */
const nd=s=>`<div class=m style="padding:10px 2px">${s}</div>`;
const hval=n=>st.h[n]?st.h[n].m:(st.fm[n]||0);
function reg(p){const n=p.length;let sx=0,sy=0,sxy=0,sxx=0;p.forEach(q=>{sx+=q[0];sy+=q[1];sxy+=q[0]*q[1];sxx+=q[0]*q[0]});const d=n*sxx-sx*sx||1,m=(n*sxy-sx*sy)/d;return[m,(sy-m*sx)/n]}
function spark(a){if(a.length<2||!a.some(v=>v>0))return nd('Builds as you log study time.');
 const mx=Math.max(1,...a),pts=a.map((v,i)=>`${(i*120/(a.length-1)).toFixed(1)},${(28-(v/mx)*22).toFixed(1)}`).join(' ');
 return `<svg viewBox="0 0 120 30" style="width:100%"><polyline points="${pts}" fill="none" stroke="var(--ac)" stroke-width="2"/></svg>`}
function tchart(){const ks=Object.keys(st.h).map(Number).filter(n=>n>=1&&n<=cd()).sort((a,b)=>a-b);
 if(ks.length<2)return nd('Trajectory builds from daily snapshots. Check back tomorrow.');
 const P=ks.map(n=>[n,st.h[n].r]),X=n=>10+(n-1)/(N-1)*280,Y=r=>95-Math.min(100,Math.max(0,r))*.88;
 const[m,b]=reg(P),pv=Math.max(0,Math.min(100,m*N+b)),ln=ks[ks.length-1],lv=st.h[ln].r;
 let s=`<svg viewBox="0 0 300 100" style="width:100%"><g stroke="var(--bd)"><line x1="10" x2="290" y1="${Y(25).toFixed(1)}" y2="${Y(25).toFixed(1)}"/><line x1="10" x2="290" y1="${Y(50).toFixed(1)}" y2="${Y(50).toFixed(1)}"/><line x1="10" x2="290" y1="${Y(75).toFixed(1)}" y2="${Y(75).toFixed(1)}"/></g>`;
 s+=P.map(([n,r])=>`<circle cx="${X(n).toFixed(1)}" cy="${Y(r).toFixed(1)}" r="2.2" fill="var(--ac)"/>`).join('');
 s+=`<polyline points="${P.map(([n,r])=>X(n).toFixed(1)+','+Y(r).toFixed(1)).join(' ')}" fill="none" stroke="var(--ac)" stroke-width="2"/>`;
 s+=`<line x1="${X(ln).toFixed(1)}" y1="${Y(lv).toFixed(1)}" x2="${X(N).toFixed(1)}" y2="${Y(m*N+b).toFixed(1)}" stroke="var(--wa)" stroke-width="1.5" stroke-dasharray="4 3"/>`;
 s+=`<circle cx="${X(N).toFixed(1)}" cy="${Y(m*N+b).toFixed(1)}" r="3.5" fill="var(--wa)"/></svg>`;
 return s+`<div class=m>Exam-day projection: <b>${Math.round(pv)}/100</b> · trending ${m>=0?'+':''}${m.toFixed(2)} pts/day. The projection is a rough guide that follows your recent snapshots.</div>`}
function dchart(){const D=cd(),cnt={};for(const k in st.q){const d=st.q[k].due;cnt[d]=(cnt[d]||0)+1}
 const a=[];for(let i=0;i<14;i++)a.push(i?cnt[D+i]||0:due(D).length);
 const mx=Math.max(1,...a),bw=280/14-4;let s=`<svg viewBox="0 0 300 78" style="width:100%">`;
 s+=a.map((v,i)=>{const h2=v/mx*52,x=10+i*(280/14)+2;return`<rect x="${x.toFixed(1)}" y="${(62-h2).toFixed(1)}" width="${bw.toFixed(1)}" height="${h2.toFixed(1)}" rx="1.5" fill="${i?'var(--ac)':'var(--wa)'}"/>`}).join('');
 s+=`<text x="10" y="75" font-size="7" fill="var(--mu)">today</text><text x="290" y="75" font-size="7" text-anchor="end" fill="var(--mu)">+13 d (${dt(D+13).getDate()} ${MN[dt(D+13).getMonth()]})</text></svg>`;
 return s+`<div class=m>Today’s amber bar includes overdue items. Reviews you do today add future dues, so later bars will grow.</div>`}
function velchart(){const D=cd();if(D<3)return nd('Velocity unlocks from Day 3.');
 const ns=[];for(let n=Math.max(1,D-13);n<=D;n++)ns.push(n);
 const ct={};for(const k in st.b){const v=st.b[k];ct[v]=(ct[v]||0)+1}
 const a=ns.map(n=>ct[n]||0),pl=ns.map(n=>plan(n).bl.length),ap=pl.reduce((x,y)=>x+y,0)/pl.length,mx=Math.max(3,...a,ap+1);
 let s=`<svg viewBox="0 0 300 78" style="width:100%">`;
 const X=i=>10+i*(280/(ns.length-1)),bw=Math.max(5,280/ns.length-4);
